<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS グラデーションジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* チェッカーボードパターン (透明度視覚化用) */
        .checkerboard-bg {
            background-color: #1e293b;
            background-image: 
                linear-gradient(45deg, #334155 25%, transparent 25%), 
                linear-gradient(-45deg, #334155 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #334155 75%), 
                linear-gradient(-45deg, transparent 75%, #334155 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* カスタムスライダーのスタイリング */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            border-radius: 9999px;
            height: 8px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #0284c7;
        }

        /* カラーストップドラッグマーカー */
        .stop-marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.2);
            cursor: grab;
            transition: border-color 0.15s, transform 0.15s;
            z-index: 10;
        }

        .stop-marker:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.25);
        }

        .stop-marker.active {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.6), 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ヘッダーエリア -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-bold fa-swatchbook text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CSS Gradient Generator</h1>
                    <p class="text-xs text-slate-400">CSS グラデーションジェネレーター</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-random" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition flex items-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-dice text-cyan-400"></i>
                    <span class="hidden sm:inline">ランダム生成</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左カラム: プレビュー & CSS出力 (5/12) -->
        <section class="lg:col-span-5 flex flex-col space-y-6">
            <!-- プレビューカード -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col flex-1">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-eye text-indigo-400"></i> プレビュー
                    </span>
                </div>

                <!-- メインプレビュー表示エリア -->
                <div class="relative w-full h-64 sm:h-80 md:h-96 rounded-xl overflow-hidden checkerboard-bg border border-slate-700/50 flex-1 group shadow-inner">
                    <div id="gradient-preview" class="w-full h-full transition-all duration-75"></div>
                    
                    <!-- オーバーレイコントロール（コピーショートカット） -->
                    <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition duration-200 flex items-center justify-center backdrop-blur-[2px]">
                        <button id="quick-copy-btn" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-sm shadow-xl flex items-center space-x-2 transform translate-y-2 group-hover:translate-y-0 transition">
                            <i class="fa-solid fa-copy"></i>
                            <span>CSSをコピー</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- CSSコード出力カード -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-code text-cyan-400"></i> 生成された CSS
                    </span>
                    <span id="copy-toast" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity">
                        <i class="fa-solid fa-check"></i> コピーしました！
                    </span>
                </div>
                <div class="relative bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-300 break-all select-all">
                    <code id="css-code-output">background: linear-gradient(90deg, #ff0055 0%, #7a00ff 100%);</code>
                    <button id="btn-copy-css" class="absolute top-2 right-2 p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition" title="クリップボードにコピー">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 右カラム: 設定パネル (7/12) -->
        <section class="lg:col-span-7 flex flex-col space-y-6">

            <!-- 1. グラデーション種別選択 -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                    <i class="fa-solid fa-layer-group text-fuchsia-400 mr-1"></i> グラデーションの種類
                </label>
                <div class="grid grid-cols-3 gap-3">
                    <button data-type="linear" class="type-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700/80 transition active-type">
                        <i class="fa-solid fa-arrows-left-right text-lg mb-1 text-cyan-400"></i>
                        <span class="text-xs font-medium">線形 (Linear)</span>
                    </button>
                    <button data-type="radial" class="type-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-800 bg-slate-950 hover:bg-slate-800/80 transition">
                        <i class="fa-solid fa-circle-dot text-lg mb-1 text-indigo-400"></i>
                        <span class="text-xs font-medium">円形 (Radial)</span>
                    </button>
                    <button data-type="conic" class="type-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-800 bg-slate-950 hover:bg-slate-800/80 transition">
                        <i class="fa-solid fa-chart-pie text-lg mb-1 text-fuchsia-400"></i>
                        <span class="text-xs font-medium">扇形 (Conic)</span>
                    </button>
                </div>

                <!-- 角度・形状・中心座標設定エリア -->
                <div id="type-specific-controls" class="pt-2 border-t border-slate-800/80 space-y-4">
                    <!-- 線形 / 扇形用: 角度設定 -->
                    <div id="angle-control-group" class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-medium text-slate-300">角度:</span>
                            <span id="angle-val-display" class="text-sm font-mono font-bold text-cyan-400 bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800">90°</span>
                        </div>
                        <div class="flex items-center space-x-3 flex-1 max-w-xs">
                            <i class="fa-solid fa-compass text-slate-500 text-sm"></i>
                            <input id="angle-slider" type="range" min="0" max="360" value="90" class="w-full">
                        </div>
                    </div>

                    <!-- 円形用: 形状 (circle/ellipse) -->
                    <div id="radial-shape-group" class="hidden flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-300">形状:</span>
                        <div class="flex space-x-2">
                            <button id="shape-circle" class="px-3 py-1 rounded-lg text-xs font-medium border border-cyan-500 bg-cyan-500/20 text-cyan-300">Circle</button>
                            <button id="shape-ellipse" class="px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800 text-slate-400 hover:text-white">Ellipse</button>
                        </div>
                    </div>

                    <!-- 円形 / 扇形用: 中心位置 (X, Y) -->
                    <div id="position-control-group" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs text-slate-400 font-medium">中心 X:</span>
                            <input id="pos-x-slider" type="range" min="0" max="100" value="50" class="flex-1">
                            <span id="pos-x-val" class="text-xs font-mono text-cyan-400 w-8 text-right">50%</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs text-slate-400 font-medium">中心 Y:</span>
                            <input id="pos-y-slider" type="range" min="0" max="100" value="50" class="flex-1">
                            <span id="pos-y-val" class="text-xs font-mono text-cyan-400 w-8 text-right">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. カラーストップ・ビジュアルコントローラー -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                        <i class="fa-solid fa-palette text-cyan-400 mr-1"></i> カラーポイントと位置
                    </label>
                    <span class="text-xs text-slate-500">バーをクリックしてポイントを追加</span>
                </div>

                <!-- ビジュアルカラーストラック（マーカー移動用） -->
                <div class="relative pt-3 pb-5 px-3">
                    <div id="color-track" class="w-full h-8 rounded-lg border border-slate-700/80 cursor-pointer relative shadow-inner checkerboard-bg overflow-visible">
                        <!-- グラデーション背景をここに動的描画 -->
                        <div id="track-gradient-bg" class="absolute inset-0 rounded-lg"></div>
                        <!-- カラーストップマーカーがここに動的に追加される -->
                    </div>
                </div>

                <!-- カラーストップ詳細リスト -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400 pb-1 border-b border-slate-800">
                        <span>ポイント一覧 (<span id="stop-count">2</span>)</span>
                        <button id="btn-add-stop" class="text-xs text-cyan-400 hover:text-cyan-300 font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-plus"></i>
                            <span>ポイント追加</span>
                        </button>
                    </div>

                    <!-- 各ポイントのエディタリスト -->
                    <div id="stops-container" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                        <!-- 動的に挿入されるカラーストップ行 -->
                    </div>
                </div>
            </div>

            <!-- 3. グラデーション プリセットギャラリー -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> プリセットギャラリー
                </label>
                <div id="presets-grid" class="grid grid-cols-4 sm:grid-cols-6 gap-2.5">
                    <!-- プリセットアイテムが動的追加 -->
                </div>
            </div>

        </section>
    </main>

    <!-- フッター -->
    <footer class="border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-500">
        <p>HEX-based CSS Gradient Studio &bull; 自由度の高いモダンCSSグラデーション生成ツール</p>
    </footer>

    <script>
        // ステートの定義
        const state = {
            type: 'linear',
            angle: 90,
            radialShape: 'circle',
            posX: 50,
            posY: 50,
            activeStopId: 1,
            stops: [
                { id: 1, color: '#FF0055', position: 0 },
                { id: 2, color: '#7A00FF', position: 100 }
            ]
        };
        let nextStopId = 3;

        // プリセットデータの定義
        const PRESETS = [
            { name: "Sunset", type: "linear", angle: 90, stops: [{color: "#FF512F", position: 0}, {color: "#DD2476", position: 100}] },
            { name: "Ocean", type: "linear", angle: 90, stops: [{color: "#2B32B2", position: 0}, {color: "#1488CC", position: 100}] },
            { name: "Neon", type: "linear", angle: 135, stops: [{color: "#F355DA", position: 0}, {color: "#6E0DD0", position: 50}, {color: "#00F2FE", position: 100}] },
            { name: "Lush", type: "linear", angle: 45, stops: [{color: "#56AB2F", position: 0}, {color: "#A8E063", position: 100}] },
            { name: "Peach", type: "linear", angle: 90, stops: [{color: "#ED4264", position: 0}, {color: "#FFEDBC", position: 100}] },
            { name: "Cosmic", type: "radial", radialShape: "circle", posX: 50, posY: 50, stops: [{color: "#FF007F", position: 0}, {color: "#7B2CBF", position: 50}, {color: "#0F172A", position: 100}] },
            { name: "Rainbow Conic", type: "conic", angle: 0, posX: 50, posY: 50, stops: [{color: "#FF0000", position: 0}, {color: "#FFFF00", position: 25}, {color: "#00FF00", position: 50}, {color: "#00FFFF", position: 75}, {color: "#FF0000", position: 100}] },
            { name: "Midnight", type: "linear", angle: 180, stops: [{color: "#0F2027", position: 0}, {color: "#203A43", position: 50}, {color: "#2C5364", position: 100}] }
        ];

        // DOM要素参照の定義
        const colorTrackEl = document.getElementById('color-track');
        const trackGradientBgEl = document.getElementById('track-gradient-bg');
        const gradientPreviewEl = document.getElementById('gradient-preview');
        const cssCodeEl = document.getElementById('css-code-output');
        const copyToast = document.getElementById('copy-toast');
        const stopsContainerEl = document.getElementById('stops-container');
        const stopCountEl = document.getElementById('stop-count');
        const angleSlider = document.getElementById('angle-slider');
        const angleValDisplay = document.getElementById('angle-val-display');
        const posXSlider = document.getElementById('pos-x-slider');
        const posYSlider = document.getElementById('pos-y-slider');
        const posXVal = document.getElementById('pos-x-val');
        const posYVal = document.getElementById('pos-y-val');
        const angleControlGroup = document.getElementById('angle-control-group');
        const radialShapeGroup = document.getElementById('radial-shape-group');
        const positionControlGroup = document.getElementById('position-control-group');

        // ユーティリティ・更新関数
        function getSortedStops() {
            return [...state.stops].sort((a, b) => a.position - b.position);
        }

        function isValidHex(hex) {
            return /^#([0-9A-F]{3}|[0-9A-F]{6}|[0-9A-F]{8})$/i.test(hex);
        }

        function generateCSS() {
            const sorted = getSortedStops();
            const stopsStr = sorted.map(s => `${s.color} ${s.position}%`).join(', ');
            if (state.type === 'linear') {
                return `background: linear-gradient(${state.angle}deg, ${stopsStr});`;
            } else if (state.type === 'radial') {
                return `background: radial-gradient(${state.radialShape} at ${state.posX}% ${state.posY}%, ${stopsStr});`;
            } else if (state.type === 'conic') {
                return `background: conic-gradient(from ${state.angle}deg at ${state.posX}% ${state.posY}%, ${stopsStr});`;
            }
            return '';
        }

        function updatePreview() {
            const css = generateCSS();
            const styleBg = css.replace('background: ', '').replace(';', '');
            gradientPreviewEl.style.background = styleBg;
            cssCodeEl.textContent = css;

            const sorted = getSortedStops();
            const trackStopsStr = sorted.map(s => `${s.color} ${s.position}%`).join(', ');
            trackGradientBgEl.style.background = `linear-gradient(90deg, ${trackStopsStr})`;

            renderTrackMarkers();
        }

        function renderTrackMarkers() {
            colorTrackEl.querySelectorAll('.stop-marker').forEach(m => m.remove());

            state.stops.forEach(stop => {
                const marker = document.createElement('div');
                marker.className = `stop-marker ${stop.id === state.activeStopId ? 'active' : ''}`;
                marker.style.left = `${stop.position}%`;
                marker.style.backgroundColor = stop.color;
                marker.dataset.id = stop.id;

                marker.addEventListener('mousedown', (e) => startMarkerDrag(e, stop.id));
                marker.addEventListener('touchstart', (e) => startMarkerDrag(e, stop.id), { passive: false });

                colorTrackEl.appendChild(marker);
            });
        }

        // カラーストップ制御リストの更新
        function renderStopsList() {
            stopsContainerEl.innerHTML = '';
            stopCountEl.textContent = state.stops.length;

            const sorted = getSortedStops();

            sorted.forEach(stop => {
                const row = document.createElement('div');
                row.dataset.id = stop.id;
                row.className = `stop-row flex items-center space-x-3 p-2 rounded-xl border transition ${
                    stop.id === state.activeStopId 
                        ? 'bg-slate-800/90 border-cyan-500/50' 
                        : 'bg-slate-950/60 border-slate-800 hover:border-slate-700'
                }`;

                // カラーピッカー & HEX入力 & 位置入力 & 削除ボタン
                row.innerHTML = `
                    <div class="relative w-8 h-8 rounded-lg overflow-hidden border border-slate-700 shrink-0 checkerboard-bg">
                        <input type="color" value="${stop.color.slice(0, 7)}" data-id="${stop.id}" class="stop-color-picker absolute -inset-2 w-12 h-12 cursor-pointer opacity-0">
                        <div class="stop-color-swatch w-full h-full pointer-events-none" style="background-color: ${stop.color}"></div>
                    </div>
                    
                    <div class="flex-1 flex items-center space-x-2">
                        <span class="text-xs text-slate-500 font-mono">HEX</span>
                        <input type="text" value="${stop.color.toUpperCase()}" data-id="${stop.id}" class="stop-hex-input bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs font-mono text-slate-200 w-24 focus:outline-none focus:border-cyan-500">
                    </div>

                    <div class="flex items-center space-x-1">
                        <input type="number" min="0" max="100" value="${Math.round(stop.position)}" data-id="${stop.id}" class="stop-pos-input bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs font-mono text-cyan-400 w-14 text-center focus:outline-none focus:border-cyan-500">
                        <span class="text-xs text-slate-500">%</span>
                    </div>

                    <button data-id="${stop.id}" class="btn-delete-stop text-slate-500 hover:text-rose-400 p-1.5 transition ${state.stops.length <= 2 ? 'opacity-30 cursor-not-allowed' : ''}" ${state.stops.length <= 2 ? 'disabled' : ''}>
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;

                // クリックでアクティブ設定
                row.addEventListener('click', (e) => {
                    if (!e.target.closest('input') && !e.target.closest('button')) {
                        setActiveStop(stop.id);
                    }
                });

                stopsContainerEl.appendChild(row);
            });

            // リスト内イベントバインド
            bindStopListEvents();
        }

        // ストップリスト内イベント付与
        function bindStopListEvents() {
            // カラーピッカー変化
            document.querySelectorAll('.stop-color-picker').forEach(picker => {
                picker.addEventListener('input', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    updateStopColor(id, e.target.value, e.target);
                });
            });

            // HEXテキスト入力変化
            document.querySelectorAll('.stop-hex-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    let val = e.target.value.trim();
                    if (!val.startsWith('#')) val = '#' + val;
                    if (isValidHex(val)) {
                        updateStopColor(id, val, e.target);
                    }
                });
                input.addEventListener('change', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    let val = e.target.value.trim();
                    if (!val.startsWith('#')) val = '#' + val;
                    if (!isValidHex(val)) {
                        e.target.value = state.stops.find(s => s.id === id).color.toUpperCase();
                    }
                });
            });

            // 位置(%)数値入力変化
            document.querySelectorAll('.stop-pos-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    let pos = Math.max(0, Math.min(100, parseInt(e.target.value) || 0));
                    updateStopPosition(id, pos, e.target);
                });
            });

            // 削除ボタン
            document.querySelectorAll('.btn-delete-stop').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    deleteStop(id);
                });
            });
        }

        // アクティブなストップを設定
        function setActiveStop(id) {
            state.activeStopId = id;
            renderTrackMarkers();
            
            // 全体再生成を避けアクティブ表示クラスのみ切り替え
            document.querySelectorAll('.stop-row').forEach(row => {
                const rowId = parseInt(row.dataset.id);
                if (rowId === id) {
                    row.className = 'stop-row flex items-center space-x-3 p-2 rounded-xl border transition bg-slate-800/90 border-cyan-500/50';
                } else {
                    row.className = 'stop-row flex items-center space-x-3 p-2 rounded-xl border transition bg-slate-950/60 border-slate-800 hover:border-slate-700';
                }
            });
        }

        // --- ストップ変更ロジック ---

        function updateStopColor(id, color, sourceElement = null) {
            const stop = state.stops.find(s => s.id === id);
            if (stop) {
                stop.color = color;
                updatePreview();
                
                // DOM全体の再描画を避け、差分要素のみを更新することでピッカーの閉じを防止
                const row = document.querySelector(`.stop-row[data-id="${id}"]`);
                if (row) {
                    const swatch = row.querySelector('.stop-color-swatch');
                    if (swatch) swatch.style.backgroundColor = color;
                    
                    const picker = row.querySelector('.stop-color-picker');
                    if (picker && sourceElement !== picker) picker.value = color.slice(0, 7);
                    
                    const hexInput = row.querySelector('.stop-hex-input');
                    if (hexInput && sourceElement !== hexInput) hexInput.value = color.toUpperCase();
                }
            }
        }

        function updateStopPosition(id, position, sourceElement = null) {
            const stop = state.stops.find(s => s.id === id);
            if (stop) {
                stop.position = position;
                updatePreview();
                
                const row = document.querySelector(`.stop-row[data-id="${id}"]`);
                if (row) {
                    const posInput = row.querySelector('.stop-pos-input');
                    if (posInput && sourceElement !== posInput) posInput.value = Math.round(position);
                }
            }
        }

        // 新しいポイントの追加
        function addStop(posPercent = 50, color = '#ffffff') {
            const newStop = {
                id: nextStopId++,
                color: color,
                position: Math.round(posPercent)
            };
            state.stops.push(newStop);
            state.activeStopId = newStop.id;
            updatePreview();
            renderStopsList();
        }

        // ポイントの削除
        function deleteStop(id) {
            if (state.stops.length <= 2) return; // 最低2個を保持
            state.stops = state.stops.filter(s => s.id !== id);
            if (state.activeStopId === id) {
                state.activeStopId = state.stops[0].id;
            }
            updatePreview();
            renderStopsList();
        }

        // --- トラック上でのマーカードラッグ処理 ---

        function startMarkerDrag(e, id) {
            e.preventDefault();
            setActiveStop(id);

            const isTouch = e.type.startsWith('touch');
            const moveEvent = isTouch ? 'touchmove' : 'mousemove';
            const upEvent = isTouch ? 'touchend' : 'mouseup';

            const onMove = (moveE) => {
                const rect = colorTrackEl.getBoundingClientRect();
                const clientX = isTouch ? moveE.touches[0].clientX : moveE.clientX;
                let offsetX = clientX - rect.left;
                let percent = Math.max(0, Math.min(100, (offsetX / rect.width) * 100));
                
                updateStopPosition(id, Math.round(percent));
            };

            const onUp = () => {
                window.removeEventListener(moveEvent, onMove);
                window.removeEventListener(upEvent, onUp);
            };

            window.addEventListener(moveEvent, onMove);
            window.addEventListener(upEvent, onUp);
        }

        // トラック直接クリックで新規ポイント追加
        colorTrackEl.addEventListener('click', (e) => {
            if (e.target.classList.contains('stop-marker')) return;
            const rect = colorTrackEl.getBoundingClientRect();
            const percent = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));

            // その位置の近似補間色を生成
            const interpColor = getRandomHex();
            addStop(percent, interpColor);
        });

        // --- モード切替とコントロールUI更新 ---

        function setGradientType(type) {
            state.type = type;

            // ボタンのアクティブスタイル切替
            document.querySelectorAll('.type-btn').forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.classList.add('border-slate-700', 'bg-slate-800/80', 'active-type');
                    btn.classList.remove('border-slate-800', 'bg-slate-950');
                } else {
                    btn.classList.remove('border-slate-700', 'bg-slate-800/80', 'active-type');
                    btn.classList.add('border-slate-800', 'bg-slate-950');
                }
            });

            // 表示するコントロールの切り替え
            if (type === 'linear') {
                angleControlGroup.classList.remove('hidden');
                radialShapeGroup.classList.add('hidden');
                positionControlGroup.classList.add('hidden');
            } else if (type === 'radial') {
                angleControlGroup.classList.add('hidden');
                radialShapeGroup.classList.remove('hidden');
                positionControlGroup.classList.remove('hidden');
            } else if (type === 'conic') {
                angleControlGroup.classList.remove('hidden');
                radialShapeGroup.classList.add('hidden');
                positionControlGroup.classList.remove('hidden');
            }

            updatePreview();
        }

        // グラデーション種別ボタンイベント
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => setGradientType(btn.dataset.type));
        });

        // 角度スライダー
        angleSlider.addEventListener('input', (e) => {
            state.angle = parseInt(e.target.value);
            angleValDisplay.textContent = `${state.angle}°`;
            updatePreview();
        });

        // 円形 形状ボタン
        document.getElementById('shape-circle').addEventListener('click', () => {
            state.radialShape = 'circle';
            document.getElementById('shape-circle').className = 'px-3 py-1 rounded-lg text-xs font-medium border border-cyan-500 bg-cyan-500/20 text-cyan-300';
            document.getElementById('shape-ellipse').className = 'px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800 text-slate-400 hover:text-white';
            updatePreview();
        });

        document.getElementById('shape-ellipse').addEventListener('click', () => {
            state.radialShape = 'ellipse';
            document.getElementById('shape-ellipse').className = 'px-3 py-1 rounded-lg text-xs font-medium border border-cyan-500 bg-cyan-500/20 text-cyan-300';
            document.getElementById('shape-circle').className = 'px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800 text-slate-400 hover:text-white';
            updatePreview();
        });

        // 位置スライダー
        posXSlider.addEventListener('input', (e) => {
            state.posX = parseInt(e.target.value);
            posXVal.textContent = `${state.posX}%`;
            updatePreview();
        });

        posYSlider.addEventListener('input', (e) => {
            state.posY = parseInt(e.target.value);
            posYVal.textContent = `${state.posY}%`;
            updatePreview();
        });

        // 追加ボタン
        document.getElementById('btn-add-stop').addEventListener('click', () => {
            addStop(50, getRandomHex());
        });

        // --- プリセット機能 & ランダム機能 ---

        function renderPresets() {
            const grid = document.getElementById('presets-grid');
            grid.innerHTML = '';

            PRESETS.forEach(preset => {
                const stopsStr = preset.stops.map(s => `${s.color} ${s.position}%`).join(', ');
                let previewStyle = '';
                if (preset.type === 'linear') previewStyle = `linear-gradient(${preset.angle || 90}deg, ${stopsStr})`;
                else if (preset.type === 'radial') previewStyle = `radial-gradient(circle, ${stopsStr})`;
                else if (preset.type === 'conic') previewStyle = `conic-gradient(from 0deg, ${stopsStr})`;

                const btn = document.createElement('button');
                btn.className = 'group relative h-12 rounded-xl overflow-hidden border border-slate-700/60 hover:border-cyan-400 transition transform hover:scale-105 shadow';
                btn.title = preset.name;
                btn.innerHTML = `<div class="w-full h-full" style="background: ${previewStyle}"></div>`;

                btn.addEventListener('click', () => applyPreset(preset));
                grid.appendChild(btn);
            });
        }

        function applyPreset(preset) {
            state.type = preset.type || 'linear';
            state.angle = preset.angle !== undefined ? preset.angle : 90;
            state.radialShape = preset.radialShape || 'circle';
            state.posX = preset.posX !== undefined ? preset.posX : 50;
            state.posY = preset.posY !== undefined ? preset.posY : 50;

            angleSlider.value = state.angle;
            angleValDisplay.textContent = `${state.angle}°`;
            posXSlider.value = state.posX;
            posXVal.textContent = `${state.posX}%`;
            posYSlider.value = state.posY;
            posYVal.textContent = `${state.posY}%`;

            state.stops = preset.stops.map((s, idx) => ({
                id: idx + 1,
                color: s.color,
                position: s.position
            }));
            nextStopId = state.stops.length + 1;
            state.activeStopId = 1;

            setGradientType(state.type);
            updatePreview();
            renderStopsList();
        }

        function getRandomHex() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // ランダムグラデーション生成
        document.getElementById('btn-random').addEventListener('click', () => {
            const types = ['linear', 'radial', 'conic'];
            const randomType = types[Math.floor(Math.random() * types.length)];
            const randomAngle = Math.floor(Math.random() * 360);
            
            state.type = randomType;
            state.angle = randomAngle;
            angleSlider.value = randomAngle;
            angleValDisplay.textContent = `${randomAngle}°`;

            const count = Math.floor(Math.random() * 2) + 2; // 2~3個のストップ
            const newStops = [];
            for (let i = 0; i < count; i++) {
                newStops.push({
                    id: i + 1,
                    color: getRandomHex(),
                    position: i === 0 ? 0 : (i === count - 1 ? 100 : Math.floor(Math.random() * 60) + 20)
                });
            }
            state.stops = newStops;
            nextStopId = count + 1;
            state.activeStopId = 1;

            setGradientType(state.type);
            updatePreview();
            renderStopsList();
        });

        // --- クリップボード コピー機能 ---

        function copyCSSToClipboard() {
            const code = cssCodeEl.textContent;
            
            // execCommand と Clipboard API のフォールバック処理
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(showCopyToast);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopyToast();
                } catch (error) {
                    console.error('Copy failed', error);
                }
                document.body.removeChild(textArea);
            }
        }

        function showCopyToast() {
            copyToast.classList.remove('opacity-0');
            copyToast.classList.add('opacity-100');
            setTimeout(() => {
                copyToast.classList.remove('opacity-100');
                copyToast.classList.add('opacity-0');
            }, 2000);
        }

        document.getElementById('btn-copy-css').addEventListener('click', copyCSSToClipboard);
        document.getElementById('quick-copy-btn').addEventListener('click', copyCSSToClipboard);

        // --- 初期化 ---
        window.addEventListener('DOMContentLoaded', () => {
            renderPresets();
            setGradientType(state.type);
            updatePreview();
            renderStopsList();
        });
    </script>
</body>
</html>
